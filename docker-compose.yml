# The whole stack: database, API and client.
#   docker compose up -d --build
#
# Credentials come from the .env file next to this one. Copy .env.example
# to .env and set your own password first.

services:
  mongo:
    image: mongo:8
    container_name: hustlehub-mongo
    restart: unless-stopped
    # 127.0.0.1 on purpose. Plain "27017:27017" would expose the database to
    # everyone on the same wifi.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      # auth is on locally too, otherwise it never actually gets tested
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: hustlehub
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      # named volume, so data survives a restart and never lands in the repo
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
    container_name: hustlehub-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/hustlehub?authSource=hustlehub
      SSL_KEY_PATH: ./certs/localhost-key.pem
      SSL_CERT_PATH: ./certs/localhost.pem
      CLIENT_ORIGIN: http://localhost:8080,http://localhost:5173
    volumes:
      - ./api/certs:/app/certs:ro
    ports:
      - "127.0.0.1:5000:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: https://localhost:5000
    container_name: hustlehub-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mongo-data:
